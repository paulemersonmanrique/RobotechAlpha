<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>Robotech - Space Shooter COMPLETO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a2a;
            font-family: 'Courier New', monospace;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        /* ==========================================
           PANTALLA DE CARGA
           ========================================== */
        #pantallaCarga {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000428, #004e92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.8s ease;
        }
        #pantallaCarga .logo-carga {
            font-size: 48px;
            color: #ffcc00;
            text-shadow: 0 0 20px #ff6600, 0 0 40px #ff3300;
            animation: tituloBrillo 1.5s ease-in-out infinite;
            letter-spacing: 4px;
            margin-bottom: 30px;
            font-weight: bold;
        }
        @keyframes tituloBrillo { 
            0%,100% { text-shadow: 0 0 20px #ff6600, 0 0 40px #ff3300; } 
            50% { text-shadow: 0 0 40px #ffaa00, 0 0 80px #ff6600; } 
        }
        #pantallaCarga .barra-contenedor {
            width: 80%;
            max-width: 500px;
            height: 24px;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.25);
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(255,204,0,0.1);
        }
        #pantallaCarga .barra-progreso {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff6600, #ffcc00, #ff6600);
            background-size: 200% 100%;
            animation: gradienteCarga 1.5s linear infinite;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        @keyframes gradienteCarga {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }
        #pantallaCarga .texto-carga {
            color: #88ccff;
            font-size: 18px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        #pantallaCarga .porcentaje-carga {
            color: #ffcc00;
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(255,204,0,0.3);
        }
        #pantallaCarga .detalle-carga {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        #pantallaCarga.oculto {
            opacity: 0;
            pointer-events: none;
        }
        @media (max-width: 600px) {
            #pantallaCarga .logo-carga { font-size: 28px; }
            #pantallaCarga .barra-contenedor { height: 18px; }
            #pantallaCarga .texto-carga { font-size: 14px; }
            #pantallaCarga .porcentaje-carga { font-size: 22px; }
        }
        
        .game-container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            display: none; 
            background: #0a0a2a;
            overflow: hidden;
        }
        canvas { 
            display: block; 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0a0a2a;
            touch-action: none;
        }
        .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffcc00; background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px; z-index: 200; text-align: center; font-size: 14px; display: none; }
        .mensaje-jefe { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); color: #ff0000; background: rgba(0,0,0,0.9); padding: 20px 40px; border-radius: 10px; font-family: monospace; font-size: 28px; font-weight: bold; z-index: 300; text-align: center; white-space: nowrap; pointer-events: none; border: 3px solid #ff0000; box-shadow: 0 0 20px rgba(255,0,0,0.5); animation: alarmaParpadeo 0.3s ease-in-out infinite; }
        @keyframes alarmaParpadeo { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); background: rgba(0,0,0,0.9); border-color: #ff0000; } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); background: rgba(255,0,0,0.8); border-color: #ffffff; color: #ffff00; } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); background: rgba(0,0,0,0.9); border-color: #ff0000; } }
        .boton-musica { position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #0f0; border: 1px solid #0f0; padding: 5px 10px; border-radius: 5px; font-size: 10px; cursor: pointer; z-index: 100; display: none; }
        .pantalla-inicio { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #000428, #004e92); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; font-family: 'Courier New', monospace; transition: opacity 0.5s ease; }
        .pantalla-inicio h1 { font-size: 64px; color: #ffcc00; text-shadow: 0 0 20px #ff6600, 0 0 40px #ff3300; animation: tituloBrillo 1.5s ease-in-out infinite; letter-spacing: 8px; margin-bottom: 30px; }
        .pantalla-inicio .tecla { display: inline-block; background: #222; border: 2px solid #ffcc00; border-radius: 10px; padding: 10px 30px; font-size: 28px; font-weight: bold; color: #ffcc00; margin: 10px; box-shadow: 0 0 15px rgba(255,204,0,0.5); cursor: pointer; touch-action: manipulation; }
        .pantalla-inicio .tecla:active { transform: scale(0.92); background: #444; }
        @media (max-width: 1100px) { .pantalla-inicio h1 { font-size: 36px; } }
        
        .touch-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            display: none;
            touch-action: none;
            pointer-events: none;
            height: 280px;
            padding: 10px 15px 20px;
        }
        .touch-controls.active { display: block; }
        .touch-controls > * { pointer-events: auto; }
        
        .joystick-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 156px;
            height: 156px;
            border-radius: 50%;
            background: rgba(255,255,255,0.10);
            border: 2px solid rgba(255,255,255,0.20);
            touch-action: none;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .joystick-base {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 72px;
            height: 72px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.25);
        }
        .joystick-thumb {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 53px;
            height: 53px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.5), rgba(255,255,255,0.15));
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 0 20px rgba(255,204,0,0.1);
            transition: none;
            touch-action: none;
        }
        .joystick-thumb.active {
            background: radial-gradient(circle, rgba(255,204,0,0.6), rgba(255,204,0,0.2));
            border-color: #ffcc00;
            box-shadow: 0 0 30px rgba(255,204,0,0.2);
        }
        .joystick-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 9px;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        
        /* BOTÓN DE REINICIO - IZQUIERDA */
        .left-buttons {
            position: absolute;
            bottom: 220px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .left-row { 
            display: flex; 
            flex-direction: column;
            gap: 12px;
        }
        .btn-restart {
            width: 89px;
            height: 89px;
            border-radius: 50%;
            border: 3px solid rgba(255,100,100,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
            color: #fff;
            touch-action: none;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.1s;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            background: rgba(255,50,50,0.15);
            opacity: 0.3;
            pointer-events: none;
        }
        .btn-restart.active {
            border-color: #ff4444;
            background: rgba(255,50,50,0.4);
            opacity: 1;
            pointer-events: auto;
        }
        .btn-restart:active, .btn-restart.pressed {
            transform: scale(0.88);
            border-color: #ffcc00;
            box-shadow: 0 0 25px rgba(255,204,0,0.3);
            background: rgba(255,50,50,0.7);
        }
        .btn-restart-label { 
            font-size: 10px; 
            margin-top: 2px; 
            color: rgba(255,255,255,0.5); 
            text-align: center; 
            letter-spacing: 0.5px; 
        }
        
        .right-buttons {
            position: absolute;
            bottom: 30px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .right-row { 
            display: flex; 
            flex-direction: column;
            gap: 12px;
        }
        .action-btn {
            width: 89px;
            height: 89px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
            color: #fff;
            touch-action: none;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.1s;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.3);
        }
        .action-btn:active, .action-btn.pressed {
            transform: scale(0.88);
            border-color: #ffcc00;
            box-shadow: 0 0 25px rgba(255,204,0,0.3);
        }
        .btn-c { background: rgba(50,255,50,0.25); border-color: #44ff88; }
        .btn-c:active, .btn-c.pressed { background: rgba(50,255,50,0.6); border-color: #88ff44; }
        .btn-x { background: rgba(255,50,50,0.25); border-color: #ff4444; }
        .btn-x:active, .btn-x.pressed { background: rgba(255,50,50,0.6); border-color: #ff8800; }
        .btn-z { background: rgba(50,150,255,0.25); border-color: #4488ff; }
        .btn-z:active, .btn-z.pressed { background: rgba(50,150,255,0.6); border-color: #88ccff; }
        
        .touch-label { font-size: 10px; margin-top: 2px; color: rgba(255,255,255,0.5); text-align: center; letter-spacing: 0.5px; }
        .touch-btn-wrapper { display: flex; flex-direction: column; align-items: center; gap: 1px; }
        
        @media (max-width: 600px) {
            .touch-controls { height: 250px; }
            .joystick-container { width: 132px; height: 132px; left: 12px; bottom: 15px; }
            .joystick-base { width: 60px; height: 60px; }
            .joystick-thumb { width: 46px; height: 46px; }
            .action-btn { width: 74px; height: 74px; font-size: 29px; }
            .btn-restart { width: 74px; height: 74px; font-size: 29px; }
            .left-buttons { bottom: 190px; left: 12px; }
            .right-buttons { right: 8px; bottom: 20px; gap: 10px; }
            .right-row { gap: 10px; }
        }
        @media (max-width: 400px) {
            .touch-controls { height: 220px; }
            .joystick-container { width: 108px; height: 108px; left: 8px; bottom: 10px; }
            .joystick-base { width: 48px; height: 48px; }
            .joystick-thumb { width: 38px; height: 38px; }
            .action-btn { width: 64px; height: 64px; font-size: 23px; }
            .btn-restart { width: 64px; height: 64px; font-size: 23px; }
            .left-buttons { bottom: 160px; left: 8px; }
            .right-buttons { right: 5px; bottom: 15px; gap: 8px; }
            .right-row { gap: 8px; }
        }

        .cargando-nivel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }
        .cargando-nivel h2 {
            color: #ffcc00;
            font-size: 42px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 30px rgba(255,204,0,0.3);
            animation: tituloBrillo 1.5s ease-in-out infinite;
        }
        .cargando-nivel p {
            color: #88ff88;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            margin-top: 20px;
        }
        .cargando-nivel .puntaje-final {
            color: #ffffff;
            font-size: 28px;
            font-family: 'Courier New', monospace;
            margin-top: 15px;
            background: rgba(255,255,255,0.1);
            padding: 10px 30px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <!-- ==========================================
    PANTALLA DE CARGA
    ========================================== -->
    <div id="pantallaCarga">
        <div class="logo-carga">⚡ ROBOTECH ALPHA ⚡</div>
        <div class="barra-contenedor">
            <div class="barra-progreso" id="barraProgreso"></div>
        </div>
        <div class="porcentaje-carga" id="porcentajeCarga">0%</div>
        <div class="texto-carga" id="textoCarga">Inicializando...</div>
        <div class="detalle-carga" id="detalleCarga">Cargando recursos</div>
    </div>

    <button id="btnMusica" class="boton-musica">🔊 MUSICA ON</button>
    <div id="loading" class="loading">Cargando recursos... 🚀</div>
    <div id="pantallaInicio" class="pantalla-inicio">
        <h1>⚡ ROBOTECH ALPHA ⚡</h1>
        <p>Presiona <span class="tecla" id="teclaC">INICIA</span></p>
    </div>
    <div class="game-container">
        <canvas id="gameCanvas" width="1598" height="922"></canvas>
    </div>

    <div id="cargandoNivel" class="cargando-nivel">
        <h2>🚀 ¡NIVEL COMPLETADO!</h2>
        <p>Preparando siguiente nivel...</p>
        <div class="puntaje-final" id="puntajeFinal">PUNTOS: 0</div>
    </div>

    <div id="touchControls" class="touch-controls">
        <div class="joystick-container" id="joystickContainer">
            <div class="joystick-base" id="joystickBase">
                <div class="joystick-thumb" id="joystickThumb"></div>
            </div>
            <span class="joystick-label">MOVIMIENTO</span>
        </div>

        <!-- BOTÓN DE REINICIO - IZQUIERDA -->
        <div class="left-buttons">
            <div class="left-row">
                <div class="touch-btn-wrapper">
                    <div class="btn-restart" id="btnRestart">⟳</div>
                    <span class="btn-restart-label">REINICIAR</span>
                </div>
            </div>
        </div>

        <div class="right-buttons">
            <div class="right-row">
                <div class="touch-btn-wrapper">
                    <div class="action-btn btn-c" id="btnC">C</div>
                    <span class="touch-label">INICIAR</span>
                </div>
                <div class="touch-btn-wrapper">
                    <div class="action-btn btn-z" id="btnZ">Z</div>
                    <span class="touch-label">TRANS</span>
                </div>
                <div class="touch-btn-wrapper">
                    <div class="action-btn btn-x" id="btnX">X</div>
                    <span class="touch-label">DISPARAR</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // SISTEMA DE CARGA CON BARRA DE PROGRESO
        // ==========================================
        const elementosCarga = {
            barra: document.getElementById('barraProgreso'),
            porcentaje: document.getElementById('porcentajeCarga'),
            texto: document.getElementById('textoCarga'),
            detalle: document.getElementById('detalleCarga'),
            pantalla: document.getElementById('pantallaCarga')
        };

        let cargaActual = 0;
        let cargaTotal = 0;
        let cargaCompletada = false;

        function actualizarCarga(progreso, mensaje, detalle) {
            const porcentaje = Math.min(Math.round(progreso * 100), 100);
            elementosCarga.barra.style.width = porcentaje + '%';
            elementosCarga.porcentaje.textContent = porcentaje + '%';
            if (mensaje) elementosCarga.texto.textContent = mensaje;
            if (detalle) elementosCarga.detalle.textContent = detalle;
        }

        function finalizarCarga() {
            if (cargaCompletada) return;
            cargaCompletada = true;
            actualizarCarga(1, '¡Listo!', 'Presiona INICIA para jugar');
            setTimeout(() => {
                elementosCarga.pantalla.classList.add('oculto');
                document.getElementById('pantallaInicio').style.display = 'flex';
                setTimeout(() => {
                    elementosCarga.pantalla.style.display = 'none';
                }, 800);
            }, 600);
        }

        // ==========================================

        function initJoystick() {
            const rect = joystickContainer.getBoundingClientRect();
            const containerSize = Math.min(rect.width, rect.height);
            joystickRadius = containerSize / 2 - 15;
            joystickCenter = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }
        
        function updateJoystick(clientX, clientY) {
            const dx = clientX - joystickCenter.x;
            const dy = clientY - joystickCenter.y;
            const dist = Math.hypot(dx, dy);
            
            let limitedX = dx;
            let limitedY = dy;
            if (dist > joystickRadius) {
                limitedX = (dx / dist) * joystickRadius;
                limitedY = (dy / dist) * joystickRadius;
            }
            
            joystickThumb.style.transform = `translate(calc(-50% + ${limitedX}px), calc(-50% + ${limitedY}px))`;
            
            const maxDist = joystickRadius;
            joystickDelta.x = limitedX / maxDist;
            joystickDelta.y = limitedY / maxDist;
            
            if (dist > 5) {
                joystickThumb.classList.add('active');
            } else {
                joystickThumb.classList.remove('active');
            }
        }
        
        function resetJoystick() {
            joystickDelta.x = 0;
            joystickDelta.y = 0;

            joystickActive = false;
            joystickTouchId = null;

            for (let a of dirs) {
                let vx = Math.sin(a) * VELOCIDAD_MISILES;
                let vy = -Math.cos(a) * VELOCIDAD_MISILES;

            let cy = player.y + player.height/2;

                misilesInversos.push({

                    vy: vy,

        function transformarMisilEnHoming(m) {
            let cx = m.x + 8, cy = m.y + 8;
            let target = encontrarEnemigoMitadSuperior(cx, cy);
            if (target) {
                let tx = target.x + (target.width || ENEMIGO_ANCHO)/2;
                let ty = target.y + (target.height || ENEMIGO_ALTO)/2;
                let dx = tx - cx, dy = ty - cy;
                let len = Math.hypot(dx, dy);
                if (len > 0) {
                    let speed = CFG.homingSpeed;
                    let vx = dx/len * speed;
                    let vy = dy/len * speed;
                    projectiles.push({ 
                        x: cx-6, y: cy-6, w: 12, h: 12, 
                        vx: vx, vy: vy,
                        esHoming: true,
                        objetivo: target,
                        velocidad: speed
                    });
                }
            }
        }
        
        function transformarMisilInversoEnHoming(m) {
            let cx = m.x + 8, cy = m.y + 8;
            let target = encontrarEnemigoMitadInferior(cx, cy);
            if (target) {
                let tx = target.x + (target.width || ENEMIGO_ANCHO)/2;
                let ty = target.y + (target.height || ENEMIGO_ALTO)/2;
                let dx = tx - cx, dy = ty - cy;
                let len = Math.hypot(dx, dy);
                if (len > 0) {

        function encontrarEnemigoMitadSuperior(x, y) {
            let cercano = null, distMin = Infinity;
            for (let e of enemies) { 
                let ey = e.y + ENEMIGO_ALTO/2;
                if (ey > MITAD_PANTALLA) continue;
                let d = Math.hypot(e.x + ENEMIGO_ANCHO/2 - x, ey - y); 
                if (d < distMin) { distMin = d; cercano = e; } 
            }
            for (let e of enemy2List) { 
                let ey = e.y + ENEMIGO2_ALTO/2;
                if (ey > MITAD_PANTALLA) continue;
                let d = Math.hypot(e.x + ENEMIGO2_ANCHO/2 - x, ey - y); 
                if (d < distMin) { distMin = d; cercano = e; } 
            }
            return cercano;
        }
        
        function encontrarEnemigoMitadInferior(x, y) {
            let cercano = null, distMin = Infinity;
            for (let e of enemies) { 
                let ey = e.y + ENEMIGO_ALTO/2;
                if (ey < MITAD_PANTALLA) continue;
                let d = Math.hypot(e.x + ENEMIGO_ANCHO/2 - x, ey - y); 
                if (d < distMin) { distMin = d; cercano = e; } 
            }
            for (let e of enemy2List) { 
                let ey = e.y + ENEMIGO2_ALTO/2;
                if (ey < MITAD_PANTALLA) continue;
                let d = Math.hypot(e.x + ENEMIGO2_ANCHO/2 - x, ey - y); 
                if (d < distMin) { distMin = d; cercano = e; } 
            }
            return cercano;
        }

        function dispararProyectil(origenX, origenY, tipo, esNave3Invertida = false) {
            let vx = CFG.proyectilSpeed;
            let vy = 0;
            
            if (tipo === "teledirigido") {
                let target = null;
                let minDist = Infinity;
                
                for (let e of enemies) {
                    let dx = (e.x + ENEMIGO_ANCHO/2) - origenX;
                    let dy = (e.y + ENEMIGO_ALTO/2) - origenY;
                    let dist = Math.hypot(dx, dy);
                    if (dist < minDist) {
                        minDist = dist;
                        target = e;
                    }
                }
                for (let e of enemy2List) {
                    let dx = (e.x + ENEMIGO2_ANCHO/2) - origenX;
                    let dy = (e.y + ENEMIGO2_ALTO/2) - origenY;
                    let dist = Math.hypot(dx, dy);
                    if (dist < minDist) {
                        minDist = dist;
                        target = e;
                    }
                }
                if (boss && bossEstado !== "ENTRANDO") {
                    let dx = (boss.x + JEFE_ANCHO/2) - origenX;
                    let dy = (boss.y + JEFE_ALTO/2) - origenY;
                    let dist = Math.hypot(dx, dy);
                    if (dist < minDist) {
                        minDist = dist;
                        target = boss;
                    }
                }
                
                if (target && minDist < 500) {
                    let dx = (target.x + (target.width || ENEMIGO_ANCHO)/2) - origenX;
                    let dy = (target.y + (target.height || ENEMIGO_ALTO)/2) - origenY;
                    let len = Math.hypot(dx, dy);
                    if (len > 0) {
                        vx = dx / len * homingProjSpeed;
                        vy = dy / len * homingProjSpeed;
                    }
                } else {
                    if (esNave3Invertida) vx = -CFG.proyectilSpeed;
                }
            } else {
                if (esNave3Invertida) vx = -CFG.proyectilSpeed;
            }
            
            projectiles.push({ x: origenX, y: origenY, w: 12, h: 12, vx: vx, vy: vy, esHoming: false });
        }

        function cambiarForma() {
            if (naveTransformada) restaurarTransformacion();
            forma = forma % 3 + 1;
            playSonidoTransformacion();
            
            if (forma === 1) { 
                player.width = FORMAS[1].ancho; 
                player.height = FORMAS[1].alto; 
                player.speed = velocidadBase; 
            } else if (forma === 2) { 
                player.width = FORMAS[2].ancho; 
                player.height = FORMAS[2].alto; 
                player.speed = velocidadBase * 0.85; 
            } else { 
                player.width = FORMAS[3].ancho; 
                player.height = FORMAS[3].alto; 
                player.speed = velocidadBase * 0.75; 
            }
            
            let cx = player.x + player.width/2, cy = player.y + player.height/2;
            player.x = Math.min(Math.max(cx - player.width/2, 10), WIDTH - player.width - 10);
            player.y = Math.min(Math.max(cy - player.height/2, 30), HEIGHT - player.height - 20);
            
            if (forma === 3) { 
                let centro = player.x + player.width/2; 
                nave3Volteada = centro > WIDTH/2; 
            }
        }
        
        function shoot() {
            if (!gameRunning || gameOver) return;
            
            let sx = player.x + player.width, sy = player.y + player.height/2;
            let tipoDisparo = "recto";
            let esInvertida = false;
            
            if (forma === 1) {
                tipoDisparo = CFG.shootType1;
                let fx = sx + CFG.shoot1X, fy = sy + CFG.shoot1Y;
                dispararProyectil(fx, fy - 4, tipoDisparo, false);
                dispararProyectil(fx, fy + 4, tipoDisparo, false);
            } else if (forma === 2 && laserEnergy >= CFG.laserCost) {
                laserEnergy -= CFG.laserCost;
                tipoDisparo = CFG.shootType2;
                let fx = sx + CFG.shoot2X;
                dispararProyectil(fx, player.y + 8, tipoDisparo, false);
                dispararProyectil(fx, player.y + player.height/2 - 6, tipoDisparo, false);
                dispararProyectil(fx, player.y + player.height - 18, tipoDisparo, false);
            } else if (forma === 3) {
                dispararRayoNave3();
            }
        }
        
        function enemigoDisparar(e) {
            let dx = (player.x + player.width/2) - (e.x + ENEMIGO_ANCHO/2);
            let dy = (player.y + player.height/2) - (e.y + ENEMIGO_ALTO/2);
            let len = Math.hypot(dx, dy);
            if (len > 0) { 
                let proj1 = {
                    x: e.x + ENEMIGO_ANCHO/2 - 12, 
                    y: e.y + ENEMIGO_ALTO/2 - 5, 
                    w: 24, h: 10, 
                    vx: dx/len * CFG.enemyProjSpeed, 
                    vy: dy/len * CFG.enemyProjSpeed, 
                    timestamp: performance.now()
                };
                enemyProjectiles.push(proj1);
                
                let angulo = Math.atan2(dy, dx);
                let desviacion = (Math.random() - 0.5) * 0.35;
                let angulo2 = angulo + desviacion;
                let proj2 = {
                    x: e.x + ENEMIGO_ANCHO/2 - 12, 
                    y: e.y + ENEMIGO_ALTO/2 - 5, 
                    w: 24, h: 10, 
                    vx: Math.cos(angulo2) * CFG.enemyProjSpeed, 
                    vy: Math.sin(angulo2) * CFG.enemyProjSpeed, 
                    timestamp: performance.now()
                };
                enemyProjectiles.push(proj2);
            }
        }

        function jefeDisparoContingencia() {
            if (!boss) return;
            let ahora = performance.now();
            if (ahora - ultimoDisparoContingencia < COOLDOWN_CONTINGENCIA) return;
            ultimoDisparoContingencia = ahora;
            if (enemyProjectiles.length > MAX_ENEMY_PROJECTILES) return;
            
            let cx = boss.x + JEFE_ANCHO/2, cy = boss.y + JEFE_ALTO/2;
            let px = player.x + player.width/2, py = player.y + player.height/2;
            let dx = px - cx, dy = py - cy, len = Math.hypot(dx, dy);
            if (len > 0) {
                let vel = CFG.jefeContingenciaSpeed;
                let desv = [-0.25, -0.1, 0.1, 0.25];
                for (let d of desv) {
                    let a = Math.atan2(dy, dx) + d;
                    enemyProjectiles.push({ x: cx - 12, y: cy - 5, w: 24, h: 10, vx: Math.cos(a) * vel, vy: Math.sin(a) * vel, timestamp: ahora });
                }
            }
        }
        
        function activarLaserJefe() {
            if (!boss || bossEstado !== "PATRULLANDO") return;
            let ahora = performance.now();
            if (ahora - ultimoLaserJefe < INTERVALO_LASER) return;
            ultimoLaserJefe = ahora;
            
            rayoLaser = {
                x: boss.x,
                y: boss.y + JEFE_ALTO/2 - 10,
                ancho: 20,
                alto: JEFE_ALTO/2 + 10,
                inicio: ahora,
                duracion: DURACION_LASER,
                activo: true
            };
        }
        
        function limpiarProyectilesViejos(ahora) {
            if (enemyProjectiles.length > 100) {
                enemyProjectiles.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                enemyProjectiles = enemyProjectiles.slice(0, MAX_ENEMY_PROJECTILES);
            }
        }
        
        function dibujarProyectilConRotacion(x, y, w, h, ang, img) {
            ctx.save(); ctx.translate(x + w/2, y + h/2); ctx.rotate(ang);
            if (img && img.complete) ctx.drawImage(img, -w/2, -h/2, w, h);
            else { ctx.fillStyle = '#ff6644'; ctx.fillRect(-w/2, -h/2, w, h); }
            ctx.restore();
        }
        
        function dibujarNaveConVolteo(imgObj, x, y, w, h, volteada) {
            if (volteada) { ctx.save(); ctx.translate(x + w/2, y + h/2); ctx.scale(-1, 1); ctx.drawImage(imgObj.img, -w/2, -h/2, w, h); ctx.restore(); }
            else { ctx.drawImage(imgObj.img, x, y, w, h); }
        }
        
        // ==========================================
        // FUNCIÓN DRAW COMPLETA
        // ==========================================
        function draw() {
            const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
            grad.addColorStop(0, CFG.bgColor1);
            grad.addColorStop(1, CFG.bgColor2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            if (CFG.estrellasActivas) {
                for (let s of stars) { ctx.fillStyle = `rgba(255,255,255,${s.brightness || CFG.estrellasBrillo})`; ctx.fillRect(s.x, s.y, 2, 2); }
            }
            
            // ==========================================
            // DIBUJAR DECORACIÓN
            // ==========================================
            for (let d of decoraciones) {
                if (decoracionImg.complete && decoracionImg.src) {
                    ctx.drawImage(decoracionImg, d.x, d.y, d.w, d.h);
                } else {
                    ctx.fillStyle = 'rgba(255, 200, 100, 0.5)';
                    ctx.fillRect(d.x, d.y, d.w, d.h);
                    ctx.strokeStyle = 'rgba(255, 200, 100, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(d.x, d.y, d.w, d.h);
                }
            }
            
            // ==========================================
            // DIBUJAR LUCIÉRNAGAS (AMARILLAS)
            // ==========================================
            for (let l of particulasLuciernagas) {
                if (l.brillo <= 0) continue;
                
                let alpha = l.brillo * 0.9;
                let size = l.tamaño * (0.5 + 0.5 * l.brillo);
                
                ctx.globalAlpha = alpha;
                ctx.fillStyle = l.color;
                ctx.fillRect(l.x - size/2, l.y - size/2, size, size);
                
                if (l.brillo > 0.5) {
                    ctx.fillStyle = '#ffffff';
                    ctx.globalAlpha = alpha * 0.3;
                    let innerSize = size * 0.3;
                    ctx.fillRect(l.x - innerSize/2, l.y - innerSize/2, innerSize, innerSize);
                }
                
                ctx.globalAlpha = 1;
            }
            
            // ==========================================
            // DIBUJAR PARTÍCULAS DE PROPULSORES DE ENEMIGOS
            // ==========================================
            for (let p of particulasPropulsoresEnemigos) {
                if (p.alpha <= 0) continue;
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 15;
                ctx.fillRect(p.x - p.tamaño/2, p.y - p.tamaño/2, p.tamaño, p.tamaño);
                ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1;
            
            // ==========================================
            // ENEMIGOS CON FLIP HORIZONTAL
            // ==========================================
            for (let e of enemies) {
                if (enemigoImg.complete) {
                    if (e.flipHorizontal) {
                        ctx.save();
                        ctx.translate(e.x + ENEMIGO_ANCHO/2, e.y + ENEMIGO_ALTO/2);
                        ctx.scale(-1, 1);
                        ctx.drawImage(enemigoImg, -ENEMIGO_ANCHO/2, -ENEMIGO_ALTO/2, ENEMIGO_ANCHO, ENEMIGO_ALTO);
                        ctx.restore();
                    } else {
                        ctx.drawImage(enemigoImg, e.x, e.y, ENEMIGO_ANCHO, ENEMIGO_ALTO);
                    }
                } else {
                    ctx.fillStyle = '#ff4444';
                    ctx.fillRect(e.x, e.y, ENEMIGO_ANCHO, ENEMIGO_ALTO);
                }
            }
            
            for (let e of enemy2List) {
                if (enemigo2Img.complete) {
                    if (e.flipHorizontal) {
                        ctx.save();
                        ctx.translate(e.x + ENEMIGO2_ANCHO/2, e.y + ENEMIGO2_ALTO/2);
                        ctx.scale(-1, 1);
                        ctx.drawImage(enemigo2Img, -ENEMIGO2_ANCHO/2, -ENEMIGO2_ALTO/2, ENEMIGO2_ANCHO, ENEMIGO2_ALTO);
                        ctx.restore();
                    } else {
                        ctx.drawImage(enemigo2Img, e.x, e.y, ENEMIGO2_ANCHO, ENEMIGO2_ALTO);
                    }
                } else {
                    ctx.fillStyle = '#ff8844';
                    ctx.fillRect(e.x, e.y, ENEMIGO2_ANCHO, ENEMIGO2_ALTO);
                }
            }
            
            if (boss && jefeImg.complete) ctx.drawImage(jefeImg, boss.x, boss.y, JEFE_ANCHO, JEFE_ALTO);
            
            if (rayoLaser && rayoLaser.activo) {
                let progreso = (performance.now() - rayoLaser.inicio) / rayoLaser.duracion;
                if (progreso < 1) {
                    rayoLaser.x -= VELOCIDAD_LASER;
                    
                    let alpha = 1 - progreso * 0.3;
                    let ancho = rayoLaser.ancho * (1 + progreso * 0.2);
                    
                    ctx.shadowColor = '#ff2200';
                    ctx.shadowBlur = 40;
                    
                    let gradLaser = ctx.createLinearGradient(rayoLaser.x, 0, rayoLaser.x - 400, 0);
                    gradLaser.addColorStop(0, `rgba(255, 50, 0, ${alpha * 0.9})`);
                    gradLaser.addColorStop(0.3, `rgba(255, 20, 0, ${alpha * 0.7})`);
                    gradLaser.addColorStop(0.7, `rgba(200, 10, 0, ${alpha * 0.4})`);
                    gradLaser.addColorStop(1, `rgba(100, 0, 0, ${alpha * 0.1})`);
                    
                    ctx.fillStyle = gradLaser;
                    ctx.fillRect(rayoLaser.x - 400, rayoLaser.y, 400, ancho);
                    
                    ctx.shadowBlur = 60;
                    ctx.fillStyle = `rgba(255, 200, 100, ${alpha * 0.5})`;
                    ctx.fillRect(rayoLaser.x - 350, rayoLaser.y + ancho * 0.2, 350, ancho * 0.6);
                    
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
                    ctx.fillRect(rayoLaser.x - 300, rayoLaser.y + ancho * 0.4, 300, ancho * 0.2);
                    
                    ctx.shadowBlur = 0;
                    
                    if (!invulnerable && player.x < rayoLaser.x && 
                        player.x + player.width > rayoLaser.x - 400 &&
                        player.y < rayoLaser.y + ancho && 
                        player.y + player.height > rayoLaser.y) {
                        lives -= 3;
                        activarInvulnerabilidad();
                        if (lives <= 0) {
                            gameOver = true;
                            document.getElementById('btnRestart').classList.add('active');
                            crearExplosionMultiple(player.x + player.width/2, player.y + player.height/2, 4);
                            if(musicaFondo) musicaFondo.pause(); 
                            if(musicaJefe) musicaJefe.pause();
                        }
                    }
                } else {
                    rayoLaser.activo = false;
                }
            }
            
            for (let p of particulasCola) {
                let progreso = (performance.now() - p.creacion) / p.vida;
                let alpha = 1 - progreso;
                if (alpha < 0) continue;
                
                let r1 = 68, g1 = 221, b1 = 255;
                let r2 = 255, g2 = 255, b2 = 255;
                let r = Math.round(r1 + (r2 - r1) * progreso);
                let g = Math.round(g1 + (g2 - g1) * progreso);
                let b = Math.round(b1 + (b2 - b1) * progreso);
                
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.8})`;
                let size = p.tamaño * (1 - progreso * 0.5);
                ctx.fillRect(p.x - size/2, p.y - size/2, size, size);
            }
            
            for (let p of particulasColaEnemigo) {
                let progreso = (performance.now() - p.creacion) / p.vida;
                let alpha = 1 - progreso;
                if (alpha < 0) continue;
                
                let r1 = 255, g1 = 221, b1 = 68;
                let r2 = 255, g2 = 34, b2 = 0;
                let r = Math.round(r1 + (r2 - r1) * progreso);
                let g = Math.round(g1 + (g2 - g1) * progreso);
                let b = Math.round(b1 + (b2 - b1) * progreso);
                
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.8})`;
                let size = p.tamaño * (1 - progreso * 0.3);
                ctx.fillRect(p.x - size/2, p.y - size/2, size, size);
            }
            
            for (let p of projectiles) { 
                if (p.esRayoNave3) {
                    ctx.shadowColor = '#00ccff';
                    ctx.shadowBlur = 30;
                    let gradRayo = ctx.createLinearGradient(p.x, p.y, p.x + p.w, p.y);
                    gradRayo.addColorStop(0, 'rgba(0, 200, 255, 0.9)');
                    gradRayo.addColorStop(0.3, 'rgba(0, 150, 255, 0.7)');
                    gradRayo.addColorStop(0.7, 'rgba(0, 100, 255, 0.4)');
                    gradRayo.addColorStop(1, 'rgba(0, 50, 255, 0.1)');
                    ctx.fillStyle = gradRayo;
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.shadowBlur = 50;
                    ctx.fillStyle = 'rgba(100, 220, 255, 0.5)';
                    ctx.fillRect(p.x + 4, p.y + 2, p.w - 8, p.h - 4);
                    ctx.shadowBlur = 0;
                } else if (proyectilImg.complete) {
                    ctx.drawImage(proyectilImg, p.x, p.y, p.w, p.h);
                } else {
                    ctx.fillStyle = '#ffff44';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                }
            }
            
            for (let m of misilesTraseros) { if (proyectilImg.complete) ctx.drawImage(proyectilImg, m.x, m.y, m.w, m.h); else { ctx.fillStyle='#ffaa44'; ctx.fillRect(m.x, m.y, m.w, m.h); } }
            for (let m of misilesInversos) {
                if (proyectilImg.complete) {
                    ctx.drawImage(proyectilImg, m.x, m.y, m.w, m.h);
                } else {
                    ctx.fillStyle = '#ffaa44';
                    ctx.fillRect(m.x, m.y, m.w, m.h);
                }
            }
            
            for (let p of particulasImpacto) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = 1 - (performance.now() - p.creacion) / p.vida;
                ctx.fillRect(p.x - p.tamaño/2, p.y - p.tamaño/2, p.tamaño, p.tamaño);
            }
            ctx.globalAlpha = 1;
            
            for (let p of enemyProjectiles) { let ang = Math.atan2(p.vy, p.vx); dibujarProyectilConRotacion(p.x, p.y, p.w, p.h, ang, enemigoProyectilImg); }
            for (let ex of explosions) { if (explosionImg.complete && ex.frame<5) { ctx.drawImage(explosionImg, ex.x-ex.size/2, ex.y-ex.size/2, ex.size, ex.size); ex.frame++; } }
            for (let e of escombros) { ctx.fillStyle = e.color; ctx.fillRect(e.x - e.tamaño/2, e.y - e.tamaño/2, e.tamaño, e.tamaño); }
            
            for (let a of astronautas) {
                if (astronautaImg.complete && astronautaImg.src) {
                    ctx.drawImage(astronautaImg, a.x, a.y, a.w, a.h);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(a.x, a.y, a.w, a.h);
                    ctx.strokeStyle = '#888888';
                    ctx.lineWidth = 1;

        // ==========================================

                const normY = moveY / len;
                player.x += normX * speed * len;
                player.y += normY * speed * len;

            player.x = Math.max(15, Math.min(WIDTH - player.width - 15, player.x));
            player.y = Math.max(40, Math.min(HEIGHT - player.height - 25, player.y));

            if (keys.KeyX && puedeDisparar && timestamp - lastShot > CFG.shotCooldown) { lastShot = timestamp; shoot(); }
            
            const leftPresionado = keys.ArrowLeft || (moveX < -0.5);

            if (timestamp - lastEnergyRegen > 500 && laserEnergy < maxEnergy) { lastEnergyRegen = timestamp; laserEnergy = Math.min(maxEnergy, laserEnergy + CFG.energyRegen); }
            
            if (boss && bossEstado === "PATRULLANDO") {
                activarLaserJefe();

            if ((!boss || bossEstado === "ENTRANDO") && timestamp - lastEnemySpawn > 1500) { lastEnemySpawn = timestamp; spawnEnemy(); }
            if ((!boss || bossEstado === "ENTRANDO") && timestamp - lastEnemy2Spawn > 1800) { lastEnemy2Spawn = timestamp; spawnEnemy2(); }
            if (CFG.estrellasActivas && timestamp - lastStarSpawn > 100) { lastStarSpawn = timestamp; stars.push({ x: WIDTH, y: Math.random() * HEIGHT, vx: CFG.estrellasVelocidad, brightness: Math.random() * 0.5 + CFG.estrellasBrillo }); }

                if (e.y > HEIGHT - ENEMIGO2_ALTO - 20) e.y = HEIGHT - ENEMIGO2_ALTO - 20;
                
                let enemyCol = getCollisionRect(e.x, e.y, ENEMIGO2_ANCHO, ENEMIGO2_ALTO);
                for (let j = 0; j < projectiles.length; j++) { let p = projectiles[j]; if (checkCollision({x:p.x, y:p.y, width:p.w, height:p.h}, enemyCol)) { 
                    // PARTÍCULAS AMARILLAS PARA ENEMY2
                    for (let k = 0; k < 8; k++) {
                        let ang = Math.random() * Math.PI * 2;
                        let vel = 2 + Math.random() * 5;
                        particulasImpacto.push({
                            x: p.x + p.w/2,
                            y: p.y + p.h/2,
                            vx: Math.cos(ang) * vel,
                            vy: Math.sin(ang) * vel,
                            tamaño: 4 + Math.random() * 6,
                            vida: 120,
                            creacion: performance.now(),
                            color: '#ffcc00'
                        });
                    }
                    projectiles.splice(j, 1); 
                    e.health--; 
                    if (e.health <= 0) { 
                        for (let k = 0; k < 15; k++) {
                            let ang = Math.random() * Math.PI * 2;
                            let vel = 3 + Math.random() * 6;
                            particulasImpacto.push({
                                x: e.x + ENEMIGO2_ANCHO/2,
                                y: e.y + ENEMIGO2_ALTO/2,
                                vx: Math.cos(ang) * vel,
                                vy: Math.sin(ang) * vel,
                                tamaño: 4 + Math.random() * 6,
                                vida: 120,
                                creacion: performance.now(),
                                color: '#ffcc00'
                            });
                        }
                        createExplosion(e.x + ENEMIGO2_ANCHO/2, e.y + ENEMIGO2_ALTO/2); 
                        crearEscombros(e.x + ENEMIGO2_ANCHO/2, e.y + ENEMIGO2_ALTO/2);
                        crearAstronauta(e.x + ENEMIGO2_ANCHO/2 - 15, e.y + ENEMIGO2_ALTO/2 - 17);
                        enemy2List.splice(i, 1); 
                        score++; 
                        i--; 
                    } 
                break; } }
                if (!invulnerable && checkCollision(playerCol, enemyCol)) { 
                    for (let k = 0; k < 20; k++) {
                        let ang = Math.random() * Math.PI * 2;
                        let vel = 3 + Math.random() * 6;
                        particulasImpacto.push({
                            x: e.x + ENEMIGO2_ANCHO/2,
                            y: e.y + ENEMIGO2_ALTO/2,
                            vx: Math.cos(ang) * vel,
                            vy: Math.sin(ang) * vel,
                            tamaño: 4 + Math.random() * 6,
                            vida: 120,
                            creacion: performance.now(),
                            color: '#ffcc00'
                        });
                    }
                    createExplosion(e.x + ENEMIGO2_ANCHO/2, e.y + ENEMIGO2_ALTO/2); 
                    enemy2List.splice(i, 1); 
                    lives--; 
                    i--; 
                    activarInvulnerabilidad(); 
                    if (lives <= 0) { 
                        gameOver = true; 
                        document.getElementById('btnRestart').classList.add('active');
                        crearExplosionMultiple(player.x + player.width/2, player.y + player.height/2, 4);
                        if(musicaFondo) musicaFondo.pause(); 
                        if(musicaJefe) musicaJefe.pause(); 
                    } 
                }
            }
            
            // ==========================================
            // BOSS CON PROPULSORES (SIN FLIP)
            // ==========================================
            if (boss) {
                // GENERAR PARTÍCULAS DE PROPULSORES DEL JEFE
                if (Math.random() > 0.2) {
                    let propX = boss.x - -300;
                    let propY = boss.y + JEFE_ALTO / 3 + (Math.random() - 0.5) * 40;
                    crearParticulaPropulsorJefe(propX, propY);
                    if (Math.random() > 0.5) {
                        let propY2 = boss.y + JEFE_ALTO / 2 + (Math.random() - 0.5) * 40;
                        crearParticulaPropulsorJefe(propX, propY2);
                    }
                    if (Math.random() > 0.7) {
                        let propY3 = boss.y + JEFE_ALTO / 2 + (Math.random() - 0.5) * 40;
                        crearParticulaPropulsorJefe(propX - 5, propY3);
                    }
                }
                
                boss.x += boss.vx; boss.y += boss.vy;
                if (bossEstado === "ENTRANDO" && boss.x <= WIDTH - JEFE_ANCHO - 30) { 
                    bossEstado = "PATRULLANDO"; 
                    boss.vx = (Math.random() - 0.5) * 7; 
                    boss.vy = (Math.random() - 0.5) * 6; 
                }
                if (bossEstado === "PATRULLANDO") {
                    if (timestamp - (boss.lastShoot||0) > CFG.bossShootDelay) { 
                        boss.lastShoot = timestamp; 
                        let dx = (player.x+player.width/2)-(boss.x+JEFE_ANCHO/2), 
                            dy = (player.y+player.height/2)-(boss.y+JEFE_ALTO/2), 
                            len = Math.hypot(dx,dy); 
                        if(len>0) {
                            let proj = { 
                                x: boss.x+JEFE_ANCHO/2-12, 
                                y: boss.y+JEFE_ALTO/2-5, 
                                w:24, h:10, 
                                vx: dx/len*5, 
                                vy: dy/len*5, 
                                timestamp: timestamp 
                            };
                            enemyProjectiles.push(proj);
                        }
                    }
                    if (timestamp - lastBossDirectionChange > 1000) { 
                        lastBossDirectionChange = timestamp; 
                        boss.vx = (Math.random() - 0.5) * 7; 
                        boss.vy = (Math.random() - 0.5) * 6; 
                    }
                    if (boss.x < 30) { boss.x = 30; boss.vx = Math.abs(boss.vx); }
                    if (boss.x > WIDTH - JEFE_ANCHO - 30) { boss.x = WIDTH - JEFE_ANCHO - 30; boss.vx = -Math.abs(boss.vx); }
                    if (boss.y < 30) { boss.y = 30; boss.vy = Math.abs(boss.vy); }
                    if (boss.y > HEIGHT - JEFE_ALTO - 30) { boss.y = HEIGHT - JEFE_ALTO - 30; boss.vy = -Math.abs(boss.vy); }
                }
                let bossCol = getCollisionRect(boss.x, boss.y, JEFE_ANCHO, JEFE_ALTO);
                for (let j = 0; j < projectiles.length; j++) { 
                    let p = projectiles[j]; 
                    if (checkCollision({x:p.x, y:p.y, width:p.w, height:p.h}, bossCol)) { 
                        crearParticulasImpacto(p.x + p.w/2, p.y + p.h/2);
                        projectiles.splice(j, 1); 
                        createExplosion(boss.x + JEFE_ANCHO/2 + (Math.random() - 0.5) * 60, boss.y + JEFE_ALTO/2 + (Math.random() - 0.5) * 50);
                        crearEscombros(boss.x + JEFE_ANCHO/2 + (Math.random() - 0.5) * 80, boss.y + JEFE_ALTO/2 + (Math.random() - 0.5) * 70);
                        
                        let porcentajeActual = (boss.health / CFG.bossHealth) * 100; 
                        let perdido = ultimoPorcentajeVidaJefe - porcentajeActual; 
                        if (perdido >= 10 && boss.health > 0) { 
                            jefeDisparoContingencia(); 
                            ultimoPorcentajeVidaJefe = Math.floor(porcentajeActual); 
                        } 
                        boss.health--; 
                        if (boss.health <= 0) { 
                            createExplosion(boss.x + JEFE_ANCHO/2, boss.y + JEFE_ALTO/2); 
                            crearEscombros(boss.x + JEFE_ANCHO/2, boss.y + JEFE_ALTO/2);
                            boss = null; 
                            victory = true; 
                            gameRunning = false;
                            misilesDesactivados = false;
                            if(musicaJefe) musicaJefe.pause(); 
                            if (musicaVictoria && musicaActiva && !CFG.muteVictoria) {
                                musicaVictoria.currentTime = 0;
                                musicaVictoria.volume = CFG.volVictoria * CFG.volMusica;
                                musicaVictoria.play().catch(e=>{});
                                
                                musicaVictoria.onended = function() {
                                    irAlNivel2();
                                };
                                setTimeout(function() {
                                    if (!document.getElementById('cargandoNivel').style.display === 'flex') {
                                        irAlNivel2();
                                    }
                                }, 5000);
                            } else {
                                setTimeout(irAlNivel2, 2000);
                            }
                        } 
                        break; 
                    } 
                }
                if (!invulnerable && checkCollision(playerCol, bossCol)) { 
                    lives--; 
                    activarInvulnerabilidad(); 
                    if (lives <= 0) { 
                        gameOver = true; 
                        document.getElementById('btnRestart').classList.add('active');
                        crearExplosionMultiple(player.x + player.width/2, player.y + player.height/2, 4);
                        if(musicaFondo) musicaFondo.pause(); 
                        if(musicaJefe) musicaJefe.pause(); 
                    } 
                }
            }
            
            for (let i = 0; i < enemyProjectiles.length; i++) { 
                let p = enemyProjectiles[i]; 
                p.x += p.vx; 
                p.y += p.vy; 
                if (p.x + p.w < 0 || p.x > WIDTH || p.y + p.h < 0 || p.y > HEIGHT) { 
                    enemyProjectiles.splice(i, 1); 
                    i--; 
                } else if (!invulnerable && player.x < p.x + p.w && player.x + player.width > p.x && player.y < p.y + p.h && player.y + player.height > p.y) { 
                    createExplosion(p.x + p.w/2, p.y + p.h/2); 
                    enemyProjectiles.splice(i, 1); 
                    lives--; 
                    i--; 
                    activarInvulnerabilidad();
                    if (lives <= 0) { 
                        gameOver = true; 
                        document.getElementById('btnRestart').classList.add('active');
                        crearExplosionMultiple(player.x + player.width/2, player.y + player.height/2, 4);
                        if(musicaFondo) musicaFondo.pause(); 
                        if(musicaJefe) musicaJefe.pause(); 
                    } 
                } 
            }
            
            limpiarProyectilesViejos(timestamp);
            
            for (let i = 0; i < astronautas.length; i++) {
                let a = astronautas[i];
                a.x += a.vx;
                a.y += a.vy + Math.sin(a.tiempo * 0.02) * 0.2;
                a.tiempo++;
                a.vida--;
                if (a.vida <= 0 || a.x < -50) {
                    astronautas.splice(i, 1);
                    i--;
                }
            }
            
            for (let i = 0; i < mensajesFlotantes.length; i++) {
                let m = mensajesFlotantes[i];
                m.y += m.vy;
                m.vida--;
                if (m.vida <= 0) {
                    mensajesFlotantes.splice(i, 1);
                    i--;
                }
            }
            
            for (let i = 0; i < explosions.length; i++) { explosions[i].frame++; if (explosions[i].frame >= 10) { explosions.splice(i, 1); i--; } }
            for (let i = 0; i < escombros.length; i++) { let e = escombros[i]; e.x += e.vx; e.y += e.vy; if (ahora - e.creacion >= CFG.particulasDuracion) { escombros.splice(i, 1); i--; } }
            if (CFG.estrellasActivas) { for (let i = 0; i < stars.length; i++) { stars[i].x += stars[i].vx; if (stars[i].x < 0) { stars.splice(i, 1); i--; } } }
            
            const leftSuelto = !keys.ArrowLeft && !(moveX < -0.5);
            if (leftSuelto && naveTransformada) {
                restaurarTransformacion();
            }
        }
        
        function gameLoop(timestamp) {
            if (gameStarted && gameRunning && !gameOver && !victory) updateGame(timestamp);
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function toggleMusica() {
            const btn = document.getElementById('btnMusica');
            if (musicaActiva) { 
                if (musicaFondo) musicaFondo.pause(); 
                if (musicaJefe) musicaJefe.pause(); 
                if (musicaVictoria) musicaVictoria.pause();
                musicaActiva = false; 
                btn.innerHTML = '🔇 MUSICA OFF'; 
                btn.style.color = '#ff4444'; 
            } else { 
                musicaActiva = true; 
                if (!musicaJefeActiva && musicaFondo && gameStarted && !CFG.muteFondo) {
                    musicaFondo.volume = CFG.volFondo * CFG.volMusica;
                    musicaFondo.play().catch(e=>{}); 
                }
                btn.innerHTML = '🔊 MUSICA ON'; 
                btn.style.color = '#0f0'; 
            }
        }
        
        function setupTouchControls() {
            const btnC = document.getElementById('btnC');
            const btnX = document.getElementById('btnX');
            const btnZ = document.getElementById('btnZ');
            const teclaC = document.getElementById('teclaC');
            const btnRestart = document.getElementById('btnRestart');
            
            function iniciarJuegoDesdeTouch() {
                if (!gameStarted && document.getElementById('pantallaInicio').style.display !== 'none') {
                    iniciarJuego();
                }
            }
            
            // Botón de reinicio
            btnRestart.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (gameOver) {
                    btnRestart.classList.add('pressed');
                    reiniciarJuego();
                    btnRestart.classList.remove('pressed');
                    btnRestart.classList.remove('active');
                }
            });
            btnRestart.addEventListener('touchend', (e) => {
                e.preventDefault();
                btnRestart.classList.remove('pressed');
            });
            btnRestart.addEventListener('touchcancel', (e) => {
                btnRestart.classList.remove('pressed');
            });
            btnRestart.addEventListener('mousedown', () => {
                if (gameOver) {
                    btnRestart.classList.add('pressed');
                    reiniciarJuego();
                    btnRestart.classList.remove('pressed');
                    btnRestart.classList.remove('active');
                }
            });
            btnRestart.addEventListener('mouseup', () => {
                btnRestart.classList.remove('pressed');
            });
            btnRestart.addEventListener('mouseleave', () => {
                btnRestart.classList.remove('pressed');
            });
            
            btnC.addEventListener('touchstart', (e) => {
                e.preventDefault();
                btnC.classList.add('pressed');
                iniciarJuegoDesdeTouch();
            });
            btnC.addEventListener('touchend', (e) => {
                e.preventDefault();
                btnC.classList.remove('pressed');
            });
            btnC.addEventListener('touchcancel', (e) => {
                btnC.classList.remove('pressed');
            });
            btnC.addEventListener('mousedown', () => {
                btnC.classList.add('pressed');
                iniciarJuegoDesdeTouch();
            });
            btnC.addEventListener('mouseup', () => {
                btnC.classList.remove('pressed');
            });
            btnC.addEventListener('mouseleave', () => {
                btnC.classList.remove('pressed');
            });
            
            teclaC.addEventListener('touchstart', (e) => {
                e.preventDefault();
                teclaC.style.transform = 'scale(0.92)';
                teclaC.style.background = '#444';
                iniciarJuegoDesdeTouch();
            });
            teclaC.addEventListener('touchend', (e) => {
                e.preventDefault();
                teclaC.style.transform = '';
                teclaC.style.background = '';
            });
            teclaC.addEventListener('touchcancel', (e) => {
                teclaC.style.transform = '';
                teclaC.style.background = '';
            });
            teclaC.addEventListener('mousedown', () => {
                teclaC.style.transform = 'scale(0.92)';
                teclaC.style.background = '#444';
                iniciarJuegoDesdeTouch();
            });
            teclaC.addEventListener('mouseup', () => {
                teclaC.style.transform = '';
                teclaC.style.background = '';
            });
            teclaC.addEventListener('mouseleave', () => {
                teclaC.style.transform = '';
                teclaC.style.background = '';
            });
            
            btnX.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys.KeyX = true;
                btnX.classList.add('pressed');
                if (!puedeDisparar) playDisparoInicio();
            });
            btnX.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys.KeyX = false;
                btnX.classList.remove('pressed');
                playDisparoFin();
            });
            btnX.addEventListener('touchcancel', (e) => {
                keys.KeyX = false;
                btnX.classList.remove('pressed');
                playDisparoFin();
            });
            btnX.addEventListener('mousedown', () => {
                keys.KeyX = true;
                btnX.classList.add('pressed');
                if (!puedeDisparar) playDisparoInicio();
            });
            btnX.addEventListener('mouseup', () => {
                keys.KeyX = false;
                btnX.classList.remove('pressed');
                playDisparoFin();
            });
            btnX.addEventListener('mouseleave', () => {
                keys.KeyX = false;
                btnX.classList.remove('pressed');
                playDisparoFin();
            });
            
            function transformarDesdeTouch() {
                if (gameStarted && !gameOver && !victory) {
                    if (performance.now() - lastMisilTrasero > 250) {
                        lastMisilTrasero = performance.now();
                        transformarConFlash();
                    }
                }
            }
            
            btnZ.addEventListener('touchstart', (e) => {
                e.preventDefault();
                btnZ.classList.add('pressed');
                transformarDesdeTouch();
            });
            btnZ.addEventListener('touchend', (e) => {
                e.preventDefault();
                btnZ.classList.remove('pressed');
            });
            btnZ.addEventListener('touchcancel', (e) => {
                btnZ.classList.remove('pressed');
            });
            btnZ.addEventListener('mousedown', () => {
                btnZ.classList.add('pressed');
                transformarDesdeTouch();
            });
            btnZ.addEventListener('mouseup', () => {
                btnZ.classList.remove('pressed');
            });
            btnZ.addEventListener('mouseleave', () => {
                btnZ.classList.remove('pressed');
            });
        }
        
        let timestamp = 0;
        function gameLoopWrapper(time) {
            timestamp = time;
            gameLoop(time);
        }
        
        document.getElementById('btnMusica').addEventListener('click', toggleMusica);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyC' && !gameStarted && document.getElementById('pantallaInicio').style.display !== 'none') { iniciarJuego(); }
            if (gameStarted) {
                if (e.code === 'ArrowLeft') { keys.ArrowLeft = true; e.preventDefault(); }
                if (e.code === 'ArrowRight') keys.ArrowRight = true;
                if (e.code === 'ArrowUp') keys.ArrowUp = true;
                if (e.code === 'ArrowDown') keys.ArrowDown = true;
                if (e.code === 'KeyX') { keys.KeyX = true; playDisparoInicio(); e.preventDefault(); }
                if (e.code === 'KeyZ') { keys.KeyZ = true; e.preventDefault(); }
            }
            if (e.code === 'KeyR' && gameOver) {
                reiniciarJuego();
            }
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') { keys.ArrowLeft = false; }
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
            if (e.code === 'ArrowUp') keys.ArrowUp = false;
            if (e.code === 'ArrowDown') keys.ArrowDown = false;
            if (e.code === 'KeyX') { keys.KeyX = false; playDisparoFin(); }
            if (e.code === 'KeyZ') keys.KeyZ = false;
        });
        
        // ==========================================
        // INICIO DEL JUEGO - CARGA DE RECURSOS
        // ==========================================
        // Iniciar la carga de todos los recursos
        cargarTodosLosRecursos();
        setupTouchControls();
        setTimeout(resizeCanvas, 100);
        gameLoopWrapper(0);
        window.CFG = CFG;
    </script>
</body>
</html>
